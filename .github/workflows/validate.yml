name: Validate website

on:
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

      - name: Install browser for consent smoke test
        run: |
          npm install --prefix /tmp/anilp-browser --no-save playwright@1.56.1
          /tmp/anilp-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Test analytics consent without sending real Google data
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/anilp-preview.log 2>&1 &
          node --input-type=module <<'JS'
          import { chromium } from '/tmp/anilp-browser/node_modules/playwright/index.mjs'
          import assert from 'node:assert/strict'
          const url = 'http://127.0.0.1:4173'
          for (let i = 0; i < 40; i++) {
            try { if ((await fetch(url)).ok) break } catch {}
            await new Promise(r => setTimeout(r, 250))
          }
          const browser = await chromium.launch()
          try {
            const context = await browser.newContext()
            let requests = 0
            await context.route(/https:\/\/[^/]*(?:googletagmanager\.com|google-analytics\.com|analytics\.google\.com)\//, async route => {
              requests++
              await route.fulfill({ contentType: 'application/javascript', body: '' })
            })
            const page = await context.newPage()
            await page.clock.setFixedTime(new Date('2026-11-26T12:00:00+01:00'))
            await page.goto(url + '/?utm_source=facebook&email=example%40invalid.test')
            await page.getByRole('button', {name:'Rifiuta statistiche'}).waitFor()
            assert.equal(requests, 0, 'no Google request before choice')
            await page.getByRole('button', {name:'Rifiuta statistiche'}).click()
            await page.reload()
            await page.getByRole('button', {name:'Preferenze cookie'}).click()
            assert.equal(requests, 0, 'no Google request after rejection')
            const tagRequest = page.waitForRequest(/googletagmanager/)
            await page.getByRole('button', {name:'Accetta statistiche'}).click()
            await tagRequest
            await page.waitForFunction(() => window.dataLayer?.some(e => e[0] === 'event' && e[1] === 'page_view'))
            await page.waitForFunction(() => Boolean(window.gtag))
            assert.equal(requests, 1, 'one Google tag load')
            const events = await page.evaluate(() => window.dataLayer.map(e => Array.from(e)))
            assert.equal(events.filter(e=>e[0]==='event' && e[1]==='page_view').length,1)
            assert.ok(!JSON.stringify(events).includes('invalid.test'), 'no arbitrary query data')
            assert.ok(events.some(e=>e[0]==='consent' && e[1]==='update' && e[2].analytics_storage==='granted'))
            const anchor = page.locator('a[href*="event-134712"]').first()
            await anchor.evaluate(a => { a.addEventListener('click', e=>e.preventDefault(), {once:true}); a.click() })
            assert.ok(await page.evaluate(()=>window.dataLayer.some(e=>e[0]==='event' && e[1]==='webinar_registration_click')))
            await page.getByRole('button', {name:'Preferenze cookie'}).click()
            await Promise.all([page.waitForEvent('load'), page.getByRole('button',{name:'Rifiuta statistiche'}).click()])
            assert.equal(requests, 1, 'no new tag request after revocation')
            assert.ok(await page.evaluate(()=>!window.gtag))
            await context.close()
            console.log('Consent smoke test passed (Google network intercepted).')
          } finally { await browser.close() }
          JS
